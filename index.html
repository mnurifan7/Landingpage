<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videy - Lanjutkan Menonton</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f8f9fb;color:#111827}
header{background:#fff;padding:25px 22px;box-shadow:0 2px 10px #ddd}
.logo{font-size:36px;font-weight:800;letter-spacing:-2px;margin-bottom:25px}
.buttons{display:flex;flex-direction:column;align-items:center;gap:15px}
.pill{background:#f2f3f6;border:0;border-radius:30px;padding:15px;width:270px;font-size:19px;color:#303744}
.advertise{margin-top:30px;color:#777;font-size:20px}
main{max-width:650px;margin:auto;padding:55px 28px;text-align:center;background:white}
h1{font-size:clamp(35px,8vw,56px);line-height:1.2;letter-spacing:-2px;margin-bottom:40px}
.desc{font-size:clamp(18px,4.5vw,29px);line-height:1.5;color:#737985;margin-bottom:75px}
.primary{width:100%;background:#111827;color:white;border:0;border-radius:28px;padding:30px 25px;display:flex;align-items:center;gap:20px;text-align:left;font-size:25px;font-weight:bold;line-height:1.4;box-shadow:0 12px 20px #ddd}
.arrow{margin-left:auto;font-size:30px;color:#bbb}
.resume{margin-top:28px;width:100%;border:1px solid #ddd;border-radius:28px;padding:25px;background:white;font-size:22px;color:#555}
.features{margin-top:80px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px;color:#999}
.feature{background:#f7f8fa;border-radius:25px;padding:13px 20px}
@media(min-width:600px){.buttons{flex-direction:row;justify-content:center}main{margin-top:20px;border-radius:20px}}
</style>
</head>
<body>
<header>
<div class="logo">videy</div>
<div class="buttons">
<button class="pill">♧ Upload</button>
<button class="pill">◉ Join Sosmed</button>
</div>
<div class="advertise">▥ &nbsp; Advertise</div>
</header>

<main>
<h1>Lanjutkan Menonton<br>Video?</h1>
<p class="desc">Video favoritmu menanti. Klik tombol di bawah untuk pengalaman tontonan tanpa hambatan.</p>

<button class="primary">
<span>▶</span>
<span>Mulai Menonton<br>Sekarang</span>
<span class="arrow">➜</span>
</button>

<button class="resume">◷ &nbsp; Lanjut dari 02:34 &nbsp; ›</button>

<div class="features">
<div class="feature">⬟ Tanpa Iklan Mengganggu</div>
<div class="feature">◴ Playback 4K</div>
<div class="feature">◎ Akses Cepat</div>
</div>
</main>
</body>
</html>
